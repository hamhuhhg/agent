<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

  <title>إدارة خوادم MCP</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
      <h1>إدارة خوادم MCP</h1>

      <div class="add-server-form">

        <button id="add-server-btn">إضافة خادم</button>
      </div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
