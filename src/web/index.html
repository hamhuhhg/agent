<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCP Server Management</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>MCP Server Management</h1>
    <div id="server-list"></div>
    <div class="add-server-form">
      <h2>Add New Server</h2>
      <input type="text" id="server-name" placeholder="Server Name">
      <input type="text" id="server-command" placeholder="Server Command">
      <button id="add-server-btn">Add Server</button>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
